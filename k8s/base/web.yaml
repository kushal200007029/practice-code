apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-web
spec:
  replicas: 2
  selector: { matchLabels: { app: todo-web } }
  template:
    metadata: { labels: { app: todo-web } }
    spec:
      containers:
        - name: web
          image: TODO_WEB_IMAGE
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: todo-web }
spec:
  type: LoadBalancer
  selector: { app: todo-web }
  ports: [{ port: 80, targetPort: 80 }]
