apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
spec:
  replicas: 2
  selector: { matchLabels: { app: todo-api } }
  template:
    metadata: { labels: { app: todo-api } }
    spec:
      containers:
        - name: api
          image: TODO_API_IMAGE
          ports: [{ containerPort: 5000 }]
          env:
            - { name: MONGODB_HOST, value: mongodb.todo.svc.cluster.local }
            - { name: MONGODB_USERNAME, value: todo }
            - { name: MONGODB_DATABASE, value: todo }
            - name: MONGODB_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb, key: mongodb-passwords } }
          readinessProbe: { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: todo-api }
spec:
  selector: { app: todo-api }
  ports: [{ port: 5000, targetPort: 5000 }]
